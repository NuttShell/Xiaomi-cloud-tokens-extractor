name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release_zip:
    name: Release zip
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Create token_extractor.zip
        run: |
          mkdir -p token_extractor
          cp token_extractor.py token_extractor/
          cp requirements.txt token_extractor/
          zip token_extractor.zip -r token_extractor
          rm -rf token_extractor
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor.zip
          path: token_extractor.zip
      - name: Upload token_extractor.zip to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: token_extractor.zip
          asset_name: token_extractor.zip
          tag: ${{ github.ref }}
          overwrite: true
  release_docker_zip:
    name: Release docker zip
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Create token_extractor.zip
        run: |
          mkdir -p token_extractor_docker
          cp token_extractor.py token_extractor_docker/
          cp requirements.txt token_extractor_docker/
          cp .dockerignore token_extractor_docker/
          cp Dockerfile token_extractor_docker/
          zip token_extractor_docker.zip -r token_extractor_docker
          rm -rf token_extractor_docker
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor_docker.zip
          path: token_extractor_docker.zip
      - name: Upload token_extractor.zip to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: token_extractor_docker.zip
          asset_name: token_extractor_docker.zip
          tag: ${{ github.ref }}
          overwrite: true
  release_win_zip:
    name: Release Windows build tools zip
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Create win_build.zip
        run: |
          mkdir -p win_build
          cp -r make_win/. win_build/
          cp token_extractor.py win_build/
          cp token_extractor.spec win_build/
          cp icon.ico win_build/
          cp requirements.txt win_build/
          (cd win_build && zip -r ../win_build.zip .)
          rm -rf win_build
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: win_build.zip
          path: win_build.zip
      - name: Upload win_build.zip to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: win_build.zip
          asset_name: win_build.zip
          tag: ${{ github.ref }}
          overwrite: true
  release_exe:
    name: Release exe
    runs-on: windows-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: '3.14.x'
      - name: Build PyInstaller bootloader from source
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip download --no-binary pyinstaller --no-deps --no-cache-dir -d pyinstaller_src pyinstaller
          pip install --verbose (Get-ChildItem pyinstaller_src\*.tar.gz).FullName
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      - name: Run pyinstaller
        run: pyinstaller token_extractor.spec
      - name: Strip Rich PE header
        shell: bash
        run: |
          python - <<'PYEOF'
          import struct, pathlib

          exe = pathlib.Path("dist/token_extractor.exe")
          data = bytearray(exe.read_bytes())
          rich = data.find(b"Rich")
          if rich == -1:
              print("Rich header not found, skipping")
          else:
              ck = struct.unpack_from("<I", data, rich + 4)[0]
              dans = struct.pack("<I", 0x536E6144 ^ ck)
              ds = data.find(dans)
              if ds == -1:
                  print("DanS marker not found, skipping")
              else:
                  data[ds:rich + 8] = b"\x00" * (rich + 8 - ds)
                  exe.write_bytes(data)
                  print(f"Stripped Rich header: offset {ds}..{rich + 8}")
          PYEOF
      - name: Smoke-test the built exe
        timeout-minutes: 1
        run: dist/token_extractor.exe --help
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor.exe
          path: dist/token_extractor.exe
      - name: Upload token_extractor.exe to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/token_extractor.exe
          asset_name: token_extractor.exe
          tag: ${{ github.ref }}
          overwrite: true
  release_linux:
    name: Release Linux binary, .deb and .rpm
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: '3.12.x'
      - name: Build binary inside old-glibc container for broad compatibility
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work -w /work \
            python:3.12-bullseye \
            bash -c '
              pip install -r requirements.txt
              pip install "pyinstaller==6.13.0"
              pyinstaller token_extractor.spec
            '
          sudo chown -R "$(id -u):$(id -g)" dist build
      - name: Check the minimum glibc version required by the binary
        run: |
          sudo apt-get install -y -qq binutils
          objdump -T dist/token_extractor | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - name: Rename binary
        run: mv dist/token_extractor dist/token_extractor_linux_amd64
      - name: Smoke-test the built binary
        timeout-minutes: 1
        run: dist/token_extractor_linux_amd64 --help
      - name: Read version from the script
        id: ver
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('token_extractor.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create .deb package
        run: |
          set -euo pipefail
          PKG_ROOT="pkg"
          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_ROOT/DEBIAN" "$PKG_ROOT/usr/bin"
          install -m 755 dist/token_extractor_linux_amd64 "$PKG_ROOT/usr/bin/token-extractor"
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: xiaomi-cloud-tokens-extractor
          Version: ${{ steps.ver.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: NuttShell
          Homepage: https://github.com/NuttShell/Xiaomi-cloud-tokens-extractor
          Description: Xiaomi Cloud Tokens Extractor
           Extracts Xiaomi Cloud device tokens and BLE keys.
          EOF
          dpkg-deb --build --root-owner-group "$PKG_ROOT" "dist/token_extractor_linux_amd64.deb"
      - name: Smoke-test the .deb package
        run: |
          set -euo pipefail
          mkdir -p /tmp/deb_test
          dpkg-deb -x dist/token_extractor_linux_amd64.deb /tmp/deb_test
          /tmp/deb_test/usr/bin/token-extractor --help
      - name: Create .rpm package with fpm
        run: |
          set -euo pipefail
          sudo gem install --no-document fpm
          fpm -s dir -t rpm \
              -n xiaomi-cloud-tokens-extractor \
              -v "${{ steps.ver.outputs.version }}" \
              --architecture x86_64 \
              --url "https://github.com/NuttShell/Xiaomi-cloud-tokens-extractor" \
              --description "Xiaomi Cloud Tokens Extractor -- extracts Xiaomi Cloud device tokens and BLE keys." \
              dist/token_extractor_linux_amd64=/usr/bin/token-extractor
          mv xiaomi-cloud-tokens-extractor-*.rpm dist/token_extractor_linux_amd64.rpm
      - name: Smoke-test the .rpm package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm cpio
          rpm -qp --queryformat 'Name: %{NAME}  Version: %{VERSION}  Arch: %{ARCH}\n' dist/token_extractor_linux_amd64.rpm
          mkdir -p /tmp/rpm_test && cd /tmp/rpm_test
          rpm2cpio "$OLDPWD/dist/token_extractor_linux_amd64.rpm" | cpio -idm
          ./usr/bin/token-extractor --help
      - name: Archive binary
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor_linux_amd64
          path: dist/token_extractor_linux_amd64
      - name: Archive .deb package
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor_linux_amd64.deb
          path: dist/token_extractor_linux_amd64.deb
      - name: Archive .rpm package
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor_linux_amd64.rpm
          path: dist/token_extractor_linux_amd64.rpm
      - name: Upload binary to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/token_extractor_linux_amd64
          asset_name: token_extractor_linux_amd64
          tag: ${{ github.ref }}
          overwrite: true
      - name: Upload .deb to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/token_extractor_linux_amd64.deb
          asset_name: token_extractor_linux_amd64.deb
          tag: ${{ github.ref }}
          overwrite: true
      - name: Upload .rpm to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/token_extractor_linux_amd64.rpm
          asset_name: token_extractor_linux_amd64.rpm
          tag: ${{ github.ref }}
          overwrite: true
