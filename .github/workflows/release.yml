name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release_zip:
    name: Release zip
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Create token_extractor.zip
        run: |
          mkdir -p token_extractor
          cp token_extractor.py token_extractor/
          cp requirements.txt token_extractor/
          zip token_extractor.zip -r token_extractor
          rm -rf token_extractor
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor.zip
          path: token_extractor.zip
      - name: Upload token_extractor.zip to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: token_extractor.zip
          asset_name: token_extractor.zip
          tag: ${{ github.ref }}
          overwrite: true
  release_docker_zip:
    name: Release docker zip
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Create token_extractor.zip
        run: |
          mkdir -p token_extractor_docker
          cp token_extractor.py token_extractor_docker/
          cp requirements.txt token_extractor_docker/
          cp .dockerignore token_extractor_docker/
          cp Dockerfile token_extractor_docker/
          zip token_extractor_docker.zip -r token_extractor_docker
          rm -rf token_extractor_docker
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor_docker.zip
          path: token_extractor_docker.zip
      - name: Upload token_extractor.zip to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: token_extractor_docker.zip
          asset_name: token_extractor_docker.zip
          tag: ${{ github.ref }}
          overwrite: true
  release_win_zip:
    name: Release Windows build tools zip
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - name: Create win_build.zip
        run: |
          mkdir -p win_build
          cp -r make_win/. win_build/
          cp token_extractor.py win_build/
          zip win_build.zip -r win_build
          rm -rf win_build
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: win_build.zip
          path: win_build.zip
      - name: Upload win_build.zip to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: win_build.zip
          asset_name: win_build.zip
          tag: ${{ github.ref }}
          overwrite: true
  release_exe:
    name: Release exe
    runs-on: windows-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: '3.13.x'
      - name: Build PyInstaller bootloader from source
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip download --no-binary pyinstaller --no-deps --no-cache-dir -d pyinstaller_src pyinstaller
          pip install --verbose (Get-ChildItem pyinstaller_src\*.tar.gz).FullName
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      - name: Run pyinstaller
        run: pyinstaller token_extractor.spec
      - name: Strip Rich PE header
        shell: bash
        run: |
          python - <<'PYEOF'
          import struct, pathlib

          exe = pathlib.Path("dist/token_extractor.exe")
          data = bytearray(exe.read_bytes())
          rich = data.find(b"Rich")
          if rich == -1:
              print("Rich header not found, skipping")
          else:
              ck = struct.unpack_from("<I", data, rich + 4)[0]
              dans = struct.pack("<I", 0x536E6144 ^ ck)
              ds = data.find(dans)
              if ds == -1:
                  print("DanS marker not found, skipping")
              else:
                  data[ds:rich + 8] = b"\x00" * (rich + 8 - ds)
                  exe.write_bytes(data)
                  print(f"Stripped Rich header: offset {ds}..{rich + 8}")
          PYEOF
      - name: Smoke-test the built exe
        timeout-minutes: 1
        run: dist/token_extractor.exe --help
      - name: Archive built file
        uses: actions/upload-artifact@v4
        with:
          name: token_extractor.exe
          path: dist/token_extractor.exe
      - name: Upload token_extractor.exe to release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/token_extractor.exe
          asset_name: token_extractor.exe
          tag: ${{ github.ref }}
          overwrite: true
